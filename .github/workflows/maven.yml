# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Backend CI

on:
  push:
    branches: [ "main", "dev"]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    steps:
      #download src code
    - name: Checkout repository
      uses: actions/checkout@v4
      #setup java
    - name: Set Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
      #build and test the application
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      #prepare docker build environment
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      #generate image tag
      
    - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Replace with your real lowercase GitHub owner/repository
          images: ghcr.io/nguyen-vietbinh/SE1906_SE196668_SDM_PE
          tags: |
            type=sha,format=short
            type=ref,event=branch
     # 6. Login to GitHub Container Registry
    - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
     # 7. Build Docker image and publish when appropriate
    - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}